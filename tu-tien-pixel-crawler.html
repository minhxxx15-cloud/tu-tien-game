// ===================== SPRITE SYSTEM =====================
const images = {};
const IMG_KEYS = Object.keys(SPRITE_DATA);
let imagesLoaded = 0;

function loadImages(cb) {
  IMG_KEYS.forEach(k => {
    const img = new Image();
    img.onload = () => { imagesLoaded++; if (imagesLoaded === IMG_KEYS.length) cb(); };
    img.src = SPRITE_DATA[k];
    images[k] = img;
  });
}

class Entity {
  constructor(x, y, type) {
    this.x = x; this.y = y; this.type = type;
    this.vx = 0; this.vy = 0;
    this.animName = ""; this.animFrame = 0; this.animTimer = 0;
    this.facing = "down"; // up/down/left/right
    this.hp = 100; this.maxHp = 100;
    this.dead = false; this.deathTimer = 0;
    this.attackTimer = 0;
    this.isAttacking = false;
    this.hitTimer = 0;
    this.flashTimer = 0;
    this.displayW = 32; this.displayH = 32; // rendered size
  }

  setAnim(name) {
    if (this.animName !== name) {
      this.animName = name;
      this.animFrame = 0;
      this.animTimer = 0;
    }
  }

  updateAnim(dt) {
    const a = ANIMS[this.animName];
    if (!a) return;
    this.animTimer += dt;
    const interval = 1000 / a.fps;
    if (this.animTimer >= interval) {
      this.animTimer -= interval;
      this.animFrame++;
      if (this.animFrame >= a.frames) {
        if (this.animName === 'p_atk_down' || this.animName === 'p_atk_side' || this.animName === 'p_atk_up') {
          this.isAttacking = false;
          this.animFrame = a.frames - 1;
        } else if (this.animName === 'p_death' || this.animName === 'orc_death' || this.animName === 'sk_death') {
          this.animFrame = a.frames - 1; // freeze last frame
        } else {
          this.animFrame = 0;
        }
      }
    }
  }

  drawSprite(ctx, cx, cy) {
    const a = ANIMS[this.animName];
    if (!a || !images[a.key]) return;
    const img = images[a.key];
    const sx = this.animFrame * a.fw;
    const sy = 0;
    // flip horizontally for left-facing
    const dw = this.displayW, dh = this.displayH;
    ctx.save();
    if (this.facing === "left") {
      ctx.scale(-1, 1);
      ctx.drawImage(img, sx, sy, a.fw, a.fh, -cx - dw/2, cy - dh/2, dw, dh);
    } else {
      ctx.drawImage(img, sx, sy, a.fw, a.fh, cx - dw/2, cy - dh/2, dw, dh);
    }
    ctx.restore();
  }
}

// ===================== PLAYER =====================
class Player extends Entity {
  constructor() {
    super(PW/2, PH/2, "player");
    this.hp = 100; this.maxHp = 100;
    this.mp = 100; this.maxMp = 100;
    this.speed = 2.5;
    this.displayW = 48; this.displayH = 48;
    this.setAnim("p_idle_down");
    this.invincible = false;
    this.invTimer = 0;
    this.mpRegen = 0;
    this.aoeCooldown = 0;
  }

  update(dt, enemies) {
    if (this.dead) { this.updateAnim(dt); return; }
    
    // Cooldowns
    if (this.attackTimer > 0) this.attackTimer -= dt;
    if (this.invTimer > 0) { this.invTimer -= dt; if (this.invTimer <= 0) this.invincible = false; }
    if (this.aoeCooldown > 0) this.aoeCooldown -= dt;
    this.mpRegen += dt;
    if (this.mpRegen > 500) { this.mpRegen = 0; this.mp = Math.min(this.maxMp, this.mp + 5); }

    // AoE attack X key
    if ((keys['KeyX'] || keys['KeyQ']) && this.aoeCooldown <= 0 && this.mp >= 30) {
      this.mp -= 30;
      this.aoeCooldown = 2000;
      enemies.forEach(e => {
        if (!e.dead) {
          const dx = e.x - this.x, dy = e.y - this.y;
          if (Math.sqrt(dx*dx + dy*dy) < 120) {
            e.takeDamage(40);
            floatingTexts.push({ x: e.x, y: e.y - 20, text: "40", color: "#ff88ff", life: 800 });
          }
        }
      });
      floatingTexts.push({ x: this.x, y: this.y - 40, text: "⚡AoE!", color: "#cc88ff", life: 800 });
    }

    // Normal attack
    let attacking = false;
    if ((keys['Space'] || keys['KeyZ']) && this.attackTimer <= 0) {
      this.attackTimer = 600;
      attacking = true;
      // Damage enemy in front
      enemies.forEach(e => {
        if (!e.dead) {
          const dx = e.x - this.x, dy = e.y - this.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          // check roughly in facing direction
          let inRange = dist < 60;
          if (inRange) {
            const dmg = 15 + Math.floor(Math.random() * 10);
            e.takeDamage(dmg);
            floatingTexts.push({ x: e.x, y: e.y - 20, text: "-" + dmg, color: "#ff4444", life: 700 });
          }
        }
      });
    }

    if (attacking) {
      this.isAttacking = true;
      if (this.facing === "left" || this.facing === "right") this.setAnim("p_atk_side");
      else if (this.facing === "up") this.setAnim("p_atk_up");
      else this.setAnim("p_atk_down");
    }

    // Movement
    let dx = 0, dy = 0;
    if (!this.isAttacking) {
      if (keys['ArrowLeft']  || keys['KeyA']) { dx -= this.speed; this.facing = "left"; }
      if (keys['ArrowRight'] || keys['KeyD']) { dx += this.speed; this.facing = "right"; }
      if (keys['ArrowUp']    || keys['KeyW']) { dy -= this.speed; this.facing = "up"; }
      if (keys['ArrowDown']  || keys['KeyS']) { dy += this.speed; this.facing = "down"; }
    }

    // Normalize diagonal
    if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

    // Move with wall collision
    const nx = this.x + dx, ny = this.y + dy;
    if (!isSolid(nx, this.y)) this.x = nx;
    if (!isSolid(this.x, ny)) this.y = ny;
    // Clamp to canvas
    this.x = Math.max(20, Math.min(PW - 20, this.x));
    this.y = Math.max(20, Math.min(PH - 20, this.y));

    // Animation
    if (!this.isAttacking) {
      if (dx !== 0 || dy !== 0) {
        if (this.facing === "left" || this.facing === "right") this.setAnim("p_run_side");
        else if (this.facing === "up") this.setAnim("p_run_up");
        else this.setAnim("p_run_down");
      } else {
        if (this.facing === "left" || this.facing === "right") this.setAnim("p_idle_side");
        else if (this.facing === "up") this.setAnim("p_idle_up");
        else this.setAnim("p_idle_down");
      }
    }
    this.updateAnim(dt);
  }

  takeDamage(dmg) {
    if (this.invincible || this.dead) return;
    this.hp -= dmg;
    this.invincible = true;
    this.invTimer = 800;
    this.setAnim("p_hit");
    floatingTexts.push({ x: this.x, y: this.y - 30, text: "-" + dmg, color: "#ff8800", life: 700 });
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      this.setAnim("p_death");
    }
  }

  draw(ctx) {
    // Invincibility flicker
    if (this.invincible && Math.floor(Date.now() / 80) % 2 === 0) return;
    this.drawSprite(ctx, this.x, this.y);
    // HP bar
    const bw = 40, bh = 5;
    ctx.fillStyle = "#300";
    ctx.fillRect(this.x - bw/2, this.y - 30, bw, bh);
    ctx.fillStyle = "#0f0";
    ctx.fillRect(this.x - bw/2, this.y - 30, bw * (this.hp / this.maxHp), bh);
  }
}

// ===================== ENEMY =====================
class Enemy extends Entity {
  constructor(x, y, kind) {
    super(x, y, "enemy");
    this.kind = kind; // "orc" or "skeleton"
    if (kind === "orc") {
      this.hp = 60; this.maxHp = 60;
      this.speed = 1.0;
      this.atk = 8;
      this.displayW = 40; this.displayH = 40;
      this.setAnim("orc_idle");
    } else {
      this.hp = 35; this.maxHp = 35;
      this.speed = 1.5;
      this.atk = 5;
      this.displayW = 36; this.displayH = 36;
      this.setAnim("sk_idle");
    }
    this.attackCd = 0;
    this.deathAnimDone = false;
    this.removeTimer = 0;
  }

  update(dt, player) {
    if (this.dead) {
      this.updateAnim(dt);
      this.deathAnimDone = true;
      this.removeTimer += dt;
      return;
    }
    if (this.attackCd > 0) this.attackCd -= dt;

    const dx = player.x - this.x, dy = player.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Facing
    if (Math.abs(dx) > Math.abs(dy)) this.facing = dx > 0 ? "right" : "left";
    else this.facing = dy > 0 ? "down" : "up";

    if (dist > 30) {
      // Chase
      const spd = this.speed;
      const nx = this.x + (dx/dist) * spd;
      const ny = this.y + (dy/dist) * spd;
      if (!isSolid(nx, this.y)) this.x = nx;
      if (!isSolid(this.x, ny)) this.y = ny;
      // animation
      if (this.kind === "orc") this.setAnim("orc_run");
      else this.setAnim("sk_run");
    } else {
      // Idle & attack
      if (this.kind === "orc") this.setAnim("orc_idle");
      else this.setAnim("sk_idle");
      if (this.attackCd <= 0) {
        this.attackCd = 1200;
        player.takeDamage(this.atk);
      }
    }
    this.updateAnim(dt);
  }

  takeDamage(dmg) {
    if (this.dead) return;
    this.hp -= dmg;
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      kills++;
      if (this.kind === "orc") this.setAnim("orc_death");
      else this.setAnim("sk_death");
    }
  }

  draw(ctx) {
    this.drawSprite(ctx, this.x, this.y);
    if (!this.dead) {
      const bw = 30, bh = 4;
      ctx.fillStyle = "#500";
      ctx.fillRect(this.x - bw/2, this.y - 25, bw, bh);
      ctx.fillStyle = "#f00";
      ctx.fillRect(this.x - bw/2, this.y - 25, bw * (this.hp / this.maxHp), bh);
    }
  }
}

// ===================== MAP HELPERS =====================
function isSolid(px, py) {
  const tx = Math.floor(px / (PW / MAP_W));
  const ty = Math.floor(py / (PH / MAP_H));
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  return MAP[ty][tx] === 3;
}

function drawMap(ctx) {
  const tw = PW / MAP_W, th = PH / MAP_H;
  for (let row = 0; row < MAP_H; row++) {
    for (let col = 0; col < MAP_W; col++) {
      const t = MAP[row][col];
      if (t === 0)      ctx.fillStyle = "#4a7c3f"; // grass
      else if (t === 1) ctx.fillStyle = "#8b6f47"; // dirt
      else if (t === 3) ctx.fillStyle = "#2d5a1b"; // dark tree area
      else              ctx.fillStyle = "#2255aa"; // water
      ctx.fillRect(col * tw, row * th, tw, th);
      // Grid line subtle
      ctx.strokeStyle = "rgba(0,0,0,0.1)";
      ctx.strokeRect(col * tw, row * th, tw, th);
    }
  }
  // Draw trees as circles on tree tiles
  for (let row = 0; row < MAP_H; row++) {
    for (let col = 0; col < MAP_W; col++) {
      if (MAP[row][col] === 3 && row > 0 && row < MAP_H - 1 && col > 0 && col < MAP_W - 1) {
        const cx2 = (col + 0.5) * tw, cy2 = (row + 0.5) * th;
        ctx.fillStyle = "#1a4010";
        ctx.beginPath();
        ctx.arc(cx2, cy2, tw * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2d6b20";
        ctx.beginPath();
        ctx.arc(cx2 - 2, cy2 - 2, tw * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

// ===================== FLOATING TEXTS =====================
let floatingTexts = [];

function updateFloatingTexts(dt) {
  floatingTexts = floatingTexts.filter(t => t.life > 0);
  floatingTexts.forEach(t => {
    t.life -= dt;
    t.y -= 0.5;
  });
}

function drawFloatingTexts(ctx) {
  floatingTexts.forEach(t => {
    ctx.globalAlpha = t.life > 0 ? Math.min(1, t.life / 300) : 0;
    ctx.fillStyle = t.color;
    ctx.font = "bold 14px monospace";
    ctx.textAlign = "center";
    ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;
}

// ===================== SPAWN SYSTEM =====================
function spawnWave(enemies) {
  const count = 2 + wave;
  const spawnPoints = [
    {x:60, y:60}, {x:580, y:60}, {x:60, y:340}, {x:580, y:340},
    {x:300, y:50}, {x:300, y:350}, {x:50, y:200}, {x:590, y:200}
  ];
  for (let i = 0; i < count; i++) {
    const sp = spawnPoints[i % spawnPoints.length];
    const kind = Math.random() < 0.4 ? "orc" : "skeleton";
    enemies.push(new Enemy(sp.x + (Math.random()-0.5)*30, sp.y + (Math.random()-0.5)*30, kind));
  }
}

// ===================== MAIN LOOP =====================
let player, enemies, lastTime;

function init() {
  player = new Player();
  enemies = [];
  floatingTexts = [];
  kills = 0; wave = 1; waveTimer = 0;
  spawnWave(enemies);
}

function update(dt) {
  if (!player.dead) {
    // Wave management
    waveTimer += dt;
    const activeEnemies = enemies.filter(e => !e.dead);
    if (waveTimer >= WAVE_INTERVAL && activeEnemies.length < 4) {
      wave++;
      waveTimer = 0;
      spawnWave(enemies);
    }
    // Remove dead enemies after anim done
    enemies = enemies.filter(e => !(e.dead && e.removeTimer > 1200));
  }

  player.update(dt, enemies);
  enemies.forEach(e => e.update(dt, player));
  updateFloatingTexts(dt);

  // Update UI
  document.getElementById("hpText").textContent = Math.max(0, player.hp);
  document.getElementById("mpText").textContent = Math.max(0, player.mp);
  document.getElementById("killText").textContent = kills;
  document.getElementById("waveText").textContent = wave;
}

function render() {
  ctx.clearRect(0, 0, PW, PH);
  drawMap(ctx);
  
  // Y-sort: draw entities by Y position
  const all = [player, ...enemies].sort((a, b) => a.y - b.y);
  all.forEach(e => e.draw(ctx));
  
  drawFloatingTexts(ctx);

  // AoE cooldown indicator
  if (player.aoeCooldown > 0) {
    ctx.fillStyle = "rgba(200,100,255,0.5)";
    ctx.font = "11px monospace";
    ctx.textAlign = "left";
    ctx.fillText("⚡ AoE: " + (player.aoeCooldown/1000).toFixed(1) + "s", 8, 16);
  }

  // Game over overlay
  if (player.dead) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, PW, PH);
    ctx.fillStyle = "#ff4444";
    ctx.font = "bold 32px monospace";
    ctx.textAlign = "center";
    ctx.fillText("☠️ GAME OVER ☠️", PW/2, PH/2 - 20);
    ctx.fillStyle = "#ccc";
    ctx.font = "16px monospace";
    ctx.fillText("Kills: " + kills + "  |  Wave: " + wave, PW/2, PH/2 + 20);
    ctx.fillStyle = "#ff8";
    ctx.fillText("Nhấn R để chơi lại", PW/2, PH/2 + 50);
  }
}

function gameLoop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// Restart
window.addEventListener("keydown", e => {
  if (e.code === "KeyR" && player.dead) {
    init();
  }
});

loadImages(() => {
  init();
  requestAnimationFrame(gameLoop);
});
</script>
