<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Tiên — Tân Thủ Thôn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif;height:100vh}
#wrap{width:100vw;height:100vh;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 12px;pointer-events:none;z-index:10}
#hud-left{display:flex;flex-direction:column;gap:4px}
.hud-bar{display:flex;align-items:center;gap:6px}
.bar-lbl{font-size:11px;width:20px}
.bar-outer{width:130px;height:7px;background:rgba(0,0,0,0.6);border-radius:4px;border:1px solid rgba(255,255,255,0.1)}
.bar-inner{height:100%;border-radius:3px;transition:width 0.2s}
.bar-inner.hp{background:linear-gradient(90deg,#7b0000,#e74c3c)}
.bar-inner.mp{background:linear-gradient(90deg,#002a7a,#2980b9)}
.bar-val{font-size:10px;color:#aaa;min-width:56px}
#hud-center{text-align:center}
.scene-name{font-size:13px;color:#e8c96d;font-weight:700;letter-spacing:2px}
.wave-txt{font-size:10px;color:#777;margin-top:2px}
#hud-right{text-align:right}
.realm-txt{font-size:12px;color:#c9a84c;font-weight:700}
.gold-txt{font-size:11px;color:#ffee88;margin-top:2px}
#skills{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.sk{width:52px;height:52px;border-radius:9px;background:rgba(10,10,20,0.9);border:1.5px solid rgba(255,255,255,0.12);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.1s;position:relative;user-select:none}
.sk:hover{border-color:rgba(201,168,76,0.7)}
.sk:active{transform:scale(0.92)}
.sk-icon{font-size:18px}.sk-key{font-size:9px;color:#555;margin-top:1px}
.sk-cd{position:absolute;inset:0;background:rgba(0,0,0,0.72);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
#dpad{position:absolute;bottom:12px;right:12px;width:96px;height:96px;z-index:10}
.dp{position:absolute;width:28px;height:28px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:#888;user-select:none}
.dp:active,.dp.held{background:rgba(255,255,255,0.22)}
#dp-u{top:0;left:34px}#dp-d{bottom:0;left:34px}#dp-l{top:34px;left:0}#dp-r{top:34px;right:0}
#msg{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:700;color:#e8c96d;text-shadow:0 2px 12px rgba(232,201,109,0.9);opacity:0;pointer-events:none;z-index:20;transition:opacity 0.2s;letter-spacing:3px;white-space:nowrap}
#msg.show{opacity:1}
#hint{position:absolute;bottom:80px;left:12px;font-size:10px;color:rgba(255,255,255,0.2);line-height:1.9;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gc"></canvas>
  <div id="hud">
    <div id="hud-left">
      <div class="hud-bar"><div class="bar-lbl" style="color:#e74c3c">HP</div><div class="bar-outer"><div class="bar-inner hp" id="b-hp" style="width:100%"></div></div><div class="bar-val" id="v-hp">1000/1000</div></div>
      <div class="hud-bar"><div class="bar-lbl" style="color:#2980b9">MP</div><div class="bar-outer"><div class="bar-inner mp" id="b-mp" style="width:100%"></div></div><div class="bar-val" id="v-mp">500/500</div></div>
    </div>
    <div id="hud-center">
      <div class="scene-name" id="sn">🏘️ Tân Thủ Thôn</div>
      <div class="wave-txt" id="wt">Khu vực an toàn</div>
    </div>
    <div id="hud-right">
      <div class="realm-txt" id="rt">Luyện Khí · T1</div>
      <div class="gold-txt" id="gt">💰 200</div>
    </div>
  </div>
  <div id="skills">
    <div class="sk" id="sk0" onclick="useSkill(0)"><div class="sk-icon">⚔️</div><div class="sk-key">Q</div></div>
    <div class="sk" id="sk1" onclick="useSkill(1)"><div class="sk-icon">🔥</div><div class="sk-key">W</div></div>
    <div class="sk" id="sk2" onclick="useSkill(2)"><div class="sk-icon">💨</div><div class="sk-key">E</div></div>
    <div class="sk" id="sk3" onclick="useSkill(3)"><div class="sk-icon">✨</div><div class="sk-key">R</div></div>
    <div class="sk" id="sk4" onclick="useSkill(4)"><div class="sk-icon">💊</div><div class="sk-key">F</div></div>
  </div>
  <div id="dpad">
    <div class="dp" id="dp-u" onpointerdown="dp('u',1)" onpointerup="dp('u',0)" onpointerleave="dp('u',0)">▲</div>
    <div class="dp" id="dp-d" onpointerdown="dp('d',1)" onpointerup="dp('d',0)" onpointerleave="dp('d',0)">▼</div>
    <div class="dp" id="dp-l" onpointerdown="dp('l',1)" onpointerup="dp('l',0)" onpointerleave="dp('l',0)">◀</div>
    <div class="dp" id="dp-r" onpointerdown="dp('r',1)" onpointerup="dp('r',0)" onpointerleave="dp('r',0)">▶</div>
  </div>
  <div id="hint">WASD di chuyển · Q/W/E/R kỹ năng<br>F tương tác NPC · Click tấn công</div>
  <div id="msg"></div>
</div>


<script src="sprites.js"></script>
<script src="scenes.js"></script>
<script src="combat.js"></script>
<script src="update.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
